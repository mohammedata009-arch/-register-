<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البرامج التخصصية | إدارة محمد طه</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --p: #4a90e2; --s: #2ecc71; --ai: #8e44ad; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; text-align: center; }
        .header { background: linear-gradient(135deg, var(--p), #2c3e50); color: white; padding: 25px; border-radius: 0 0 30px 30px; }
        .card { background: white; margin: 15px auto; width: 92%; max-width: 450px; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .quiz-option { background: #f0f2f5; padding: 12px; margin: 5px 0; border-radius: 10px; cursor: pointer; border: 1px solid #ddd; }
        .quiz-option:hover { background: #e0e0e0; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-family: inherit; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .nav { position: fixed; bottom: 10px; width: 96%; left: 2%; background: white; display: flex; padding: 10px 0; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); z-index: 1000; }
        .nav-item { flex: 1; cursor: pointer; color: #888; font-size: 10px; }
        .nav-item.active { color: var(--p); font-weight: bold; }
        .window { display: none; } .active-win { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin: 0;">منصة البرامج التخصصية</h2>
    <p style="font-size: 12px; margin: 5px 0;">إدارة: محمد طه عطا المنان طه</p>
</div>

<div id="wRegister" class="window active-win card">
    <h3>📝 طلب اشتراك في برنامج</h3>
    <input type="text" id="regName" placeholder="الاسم الكامل">
    <select id="regProgram">
        <option value="الماجستير المصغر">الماجستير المصغر (سنة)</option>
        <option value="كورس مخاطبة مبتدئين">كورس مخاطبة للمبتدئين</option>
        <option value="نادي مخاطبة">نادي مخاطبة</option>
        <option value="الهندسة المدنية">دورة الهندسة المدنية</option>
    </select>
    <select id="regMethod">
        <option value="WhatsApp">تفعيل عبر الواتساب</option>
        <option value="Email">تفعيل عبر الإيميل</option>
    </select>
    <input type="text" id="regContact" placeholder="رقم الهاتف أو الإيميل">
    <button class="btn" style="background:var(--s)" onclick="submitRegistration()">إرسال الطلب</button>
</div>

<div id="wQuiz" class="window card">
    <div id="quizMain">
        <h3>📝 الاختبارات التفاعلية</h3>
        <div class="quiz-grid">
            <button class="quiz-option" onclick="loadQuiz('Civil')">🏗️ هندسة مدنية</button>
            <button class="quiz-option" onclick="loadQuiz('Maliki')">📜 فقه مالكي</button>
            <button class="quiz-option" onclick="loadQuiz('English')">🇬🇧 English</button>
            <button class="quiz-option" onclick="loadQuiz('Arabic')">🇸🇩 لغة عربية</button>
        </div>
    </div>
    <div id="quizContainer" style="display:none;">
        <h4 id="quizTitle"></h4>
        <p id="quizQuestion"></p>
        <div id="quizOptions"></div>
        <button class="btn" style="background:#888; margin-top:10px;" onclick="backToQuizzes()">رجوع</button>
    </div>
</div>

<div id="wAI" class="window card">
    <h3>🤖 المستشار الذكي (AI)</h3>
    <textarea id="aiQuery" rows="3" placeholder="اسأل أي سؤال..."></textarea>
    <button class="btn" style="background:var(--ai)" onclick="askAI()">إرسال</button>
    <div id="aiRes" style="margin-top:10px;"></div>
</div>

<div class="nav">
    <div class="nav-item active" onclick="tab('wRegister',this)">📝<br>تسجيل</div>
    <div class="nav-item" onclick="tab('wQuiz',this)">📝<br>Quizzes</div>
    <div class="nav-item" onclick="tab('wAI',this)">🤖<br>اسأل AI</div>
    <div class="nav-item" onclick="tab('wLogin',this)">🔑<br>دخول</div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = {
        databaseURL: "https://taha-academy-97d5e-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function tab(id, el) {
        document.querySelectorAll('.window').forEach(w => w.classList.remove('active-win'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(id).classList.add('active-win');
        el.classList.add('active');
    }

    // نظام التسجيل
    function submitRegistration() {
        const name = document.getElementById('regName').value;
        const prog = document.getElementById('regProgram').value;
        const method = document.getElementById('regMethod').value;
        const contact = document.getElementById('regContact').value;

        if(!name || !contact) return alert("يرجى ملء كافة الحقول");

        const message = `طلب اشتراك جديد:\nالاسم: ${name}\nالبرنامج: ${prog}\nوسيلة التواصل: ${method}\nالمعرف: ${contact}`;
        
        if(method === "WhatsApp") {
            window.open(`https://wa.me/249999240574?text=${encodeURIComponent(message)}`);
        } else {
            window.location.href = `mailto:taha@example.com?subject=Registration&body=${encodeURIComponent(message)}`;
        }
    }

    // نظام الكويزات الفعال
    const quizData = {
        'Civil': { q: "ما هي المادة الأساسية لمقاومة الشد في الخرسانة؟", a: ["الرمل", "حديد التسليح", "الحصى"], correct: 1 },
        'Maliki': { q: "من أشهر كتب المذهب المالكي التي جمعت الفقه والأثر؟", a: ["الموطأ", "الأم", "المغني"], correct: 0 },
        'English': { q: "Which word is a verb?", a: ["Apple", "Running", "Blue"], correct: 1 },
        'Arabic': { q: "ما هو الفاعل في جملة 'كتب محمدُ الدرس'؟", a: ["كتب", "محمد", "الدرس"], correct: 1 }
    };

    function loadQuiz(type) {
        document.getElementById('quizMain').style.display = 'none';
        const container = document.getElementById('quizContainer');
        container.style.display = 'block';
        const data = quizData[type];
        document.getElementById('quizTitle').innerText = "اختبار " + type;
        document.getElementById('quizQuestion').innerText = data.q;
        const optionsDiv = document.getElementById('quizOptions');
        optionsDiv.innerHTML = "";
        data.a.forEach((opt, index) => {
            const btn = document.createElement('div');
            btn.className = 'quiz-option';
            btn.innerText = opt;
            btn.onclick = () => {
                if(index === data.correct) alert("إجابة صحيحة! 🎉");
                else alert("إجابة خاطئة، حاول مرة أخرى.");
            };
            optionsDiv.appendChild(btn);
        });
    }

    function backToQuizzes() {
        document.getElementById('quizMain').style.display = 'block';
        document.getElementById('quizContainer').style.display = 'none';
    }

    function askAI() {
        const q = document.getElementById('aiQuery').value;
        if(q) document.getElementById('aiRes').innerText = "🤖 جاري معالجة سؤالك حول: " + q;
    }
</script>
</body>
</html>
