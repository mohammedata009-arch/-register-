<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البرامج التخصصية | إدارة محمد طه</title>
    <style>
        :root {
            --bg: #f8faff;
            --primary: #4e73df;
            --secondary: #22c55e;
            --accent: #f59e0b;
            --card: #ffffff;
            --text: #2d3748;
            --soft-blue: #eef2ff;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* رأس الصفحة العصري */
        .header {
            width: 100%;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .header h1 { font-size: 24px; margin: 0; letter-spacing: 1px; }
        .header p { font-size: 14px; opacity: 0.9; margin-top: 10px; }

        /* حاوية النوافذ */
        .window {
            display: none;
            width: 90%;
            max-width: 420px;
            animation: fadeIn 0.5s ease-out;
        }
        .window.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* البطاقات التفاعلية */
        .card {
            background: var(--card);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.8);
            margin-top: 10px;
        }

        .info-bubble {
            background: var(--soft-blue);
            color: #4338ca;
            padding: 15px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #e0e7ff;
            line-height: 1.6;
        }

        /* الحقول بتصميم عصري */
        input, select {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: 2px solid #f1f5f9;
            border-radius: 18px;
            background: #fdfdfd;
            font-size: 15px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
            box-shadow: 0 0 15px rgba(78, 115, 223, 0.1);
        }

        /* أزرار ممتعة وتفاعلية */
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .btn:active { transform: scale(0.95); }

        .btn-main { background: linear-gradient(135deg, #4e73df, #224abe); color: white; }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }

        /* شريط التنقل السفلي العائم */
        .nav-bar {
            position: fixed;
            bottom: 20px;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            display: flex;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            border-radius: 22px;
            transition: 0.3s;
            font-weight: 600;
            color: #64748b;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>البرامج التخصصية</h1>
        <p>إدارة محمد طه عطا المنان طه</p>
    </div>

    <div id="win-login" class="window active">
        <div class="card">
            <div style="text-align: center; font-size: 40px; margin-bottom: 10px;">✨</div>
            <h3 style="text-align: center; margin: 0 0 20px 0;">مرحباً بك مجدداً</h3>
            <input type="text" id="access-key" placeholder="أدخل رمز الدخول السري">
            <button class="btn btn-main" onclick="verifyAccess()">دخول المنصة</button>
        </div>
    </div>

    <div id="win-content" class="window">
        <div class="info-bubble">
            <strong>📢 إشعار جديد:</strong><br>
            أهلاً بك! تم تحديث مصادر التعلم على GitHub للأسبوع الحالي.
        </div>
        <div class="card">
            <h4 style="margin:0 0 15px;">👤 ملفك التعليمي</h4>
            <div style="font-size: 14px; line-height: 2;">
                <div>البرنامج: <span id="s-course" style="color:var(--primary); font-weight:bold;"></span></div>
                <div>رقم العضوية: <span id="s-id" style="color:var(--accent); font-weight:bold;"></span></div>
            </div>
            <br>
            <button class="btn btn-success" onclick="window.open('https://github.com/mohammedata009-arch')">📁 ملفات الدورة (GitHub)</button>
        </div>
        <button onclick="location.reload()" style="background:none; border:none; color:#94a3b8; width:100%; margin-top:20px; cursor:pointer;">تسجيل الخروج</button>
    </div>

    <div id="win-reg" class="window">
        <div class="card">
            <h3 style="margin-top:0;">📝 انضم إلينا</h3>
            <div class="info-bubble" style="background:#fff7ed; color:#9a3412; border-color:#ffedd5;">
                الرسوم: 500,000 ج.س<br>
                الحساب: 2473368 (بنك الخرطوم)
            </div>
            <input type="text" id="reg-name" placeholder="الاسم الكامل">
            <select id="reg-course-select">
                <option>الماجستير المصغر في الترجمة واللغة الإنجليزية</option>
                <option>التصميم الإنشائي</option>
                <option>التمريض</option>
            </select>
            <button class="btn btn-main" onclick="submitRegistration()">إرسال طلب الانضمام</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="navTo('win-login', this)">دخول</div>
        <div class="nav-item" onclick="navTo('win-reg', this)">تسجيل</div>
    </div>

    <script>
        function navTo(id, el) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function verifyAccess() {
            const key = document.getElementById('access-key').value;
            if(key.startsWith("KEY-")) {
                document.getElementById('win-login').classList.remove('active');
                document.getElementById('win-content').classList.add('active');
                document.getElementById('s-id').innerText = "MT-" + key.split("-")[1];
                document.getElementById('s-course').innerText = "تم التفعيل";
            } else {
                alert("يرجى التأكد من الرمز السري");
            }
        }

        function submitRegistration() {
            const name = document.getElementById('reg-name').value;
            const course = document.getElementById('reg-course-select').value;
            const msg = `طلب تسجيل:\nالاسم: ${name}\nالبرنامج: ${course}\nإدارة محمد طه`;
            window.open(`https://wa.me/249999240574?text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
