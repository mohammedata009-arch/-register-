<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البرامج التخصصية | إدارة محمد طه</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --p: #1a73e8; --s: #34a853; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; text-align: center; color: #333; }
        .header { background: linear-gradient(135deg, var(--p), #2c3e50); color: white; padding: 25px; border-radius: 0 0 30px 30px; }
        .card { background: white; margin: 15px auto; width: 92%; max-width: 450px; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        #studentProfile { display: none; background: #fff; border-top: 5px solid var(--s); text-align: right; animation: fadeIn 0.5s; }
        .profile-item { border-bottom: 1px solid #f0f0f0; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .profile-item b { color: var(--p); font-size: 14px; }
        .link-box { background: #e8f0fe; padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px dashed var(--p); text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .nav { position: fixed; bottom: 10px; width: 96%; left: 2%; background: white; display: flex; padding: 10px 0; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .nav-item { flex: 1; cursor: pointer; color: #888; font-size: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin: 0;">منصة البرامج التخصصية</h2>
    <p style="font-size: 12px; margin: 5px 0;">إدارة: محمد طه عطا المنان طه</p>
</div>

<div id="wLogin" class="card">
    <div id="loginArea">
        <h3>🔑 تسجيل دخول المتدرب</h3>
        <input type="text" id="keyIn" placeholder="أدخل كود التفعيل الخاص بك">
        <button class="btn" style="background:var(--p)" onclick="checkKey()">تفعيل العضوية</button>
    </div>

    <div id="studentProfile">
        <h4 style="text-align:center; color:var(--s); margin-top:0;">✅ بيانات العضوية النشطة</h4>
        <div class="profile-item"><span>اسم المتدرب:</span> <b id="pName"></b></div>
        <div class="profile-item"><span>رقم التفعيل:</span> <b id="pKey"></b></div>
        <div class="profile-item"><span>البرنامج الدراسي:</span> <b id="pProg"></b></div>
        <div class="profile-item"><span>مدة البرنامج:</span> <b id="pDur"></b></div>
        <div class="profile-item"><span>تاريخ الاشتراك:</span> <b id="pDate"></b></div>
        
        <div class="link-box">
            <p style="margin:0 0 10px; font-size:13px; color:#555;">🔗 رابط المحتوى التعليمي الخاص بك:</p>
            <a id="pLink" href="#" target="_blank" style="color: var(--p); font-weight: bold; text-decoration: none; word-break: break-all;">جاري جلب الرابط...</a>
        </div>
        
        <button class="btn" style="background:var(--s); margin-top:15px;" onclick="location.reload()">تسجيل خروج</button>
    </div>
</div>

<script>
    // إعدادات Firebase من مشروعك الحالي
    const firebaseConfig = { databaseURL: "https://taha-academy-97d5e-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function checkKey() {
        const key = document.getElementById('keyIn').value;
        if(!key) return alert("يرجى إدخال الكود");

        // البحث في السحابة دون مسح أي بيانات قديمة
        db.ref('users').orderByChild('key').equalTo(key).once('value', s => {
            if(s.exists()) {
                let u; s.forEach(c => { u = c.val(); });
                
                // إظهار واجهة العضوية وإخفاء منطقة الدخول
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('studentProfile').style.display = 'block';
                
                // تعبئة المعلومات التفاعلية
                document.getElementById('pName').innerText = u.name;
                document.getElementById('pKey').innerText = u.key;
                document.getElementById('pProg').innerText = u.type;
                document.getElementById('pDate').innerText = u.date || "غير محدد";
                
                // تحديد المدة تلقائياً بناءً على طلبك
                document.getElementById('pDur').innerText = (u.type.includes("ماجستير")) ? "سنة واحدة" : "شهر واحد";
                
                // عرض الرابط المرسل من الإدارة داخل الصفحة
                const linkElem = document.getElementById('pLink');
                if(u.link) {
                    linkElem.href = u.link;
                    linkElem.innerText = "اضغط هنا لفتح الحقيبة التدريبية";
                } else {
                    linkElem.innerText = "لم يتم إدراج رابط بعد، تواصل مع الإدارة";
                    linkElem.style.color = "red";
                }
            } else { 
                alert("❌ الكود غير موجود. تأكد من الكود أو تواصل مع الإدارة لتفعيل عضويتك."); 
            }
        });
    }
</script>
</body>
</html>
