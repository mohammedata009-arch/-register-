<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | محمد طه</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .admin-box { background: white; max-width: 600px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        input, select, textarea { width: 95%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        .btn-add { background: #1a73e8; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .user-card { background: #fff; border: 1px solid #eee; padding: 15px; margin-top: 10px; border-radius: 10px; text-align: right; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>إدارة المتدربين والرسائل</h2>
    <input type="text" id="sName" placeholder="اسم المتدرب">
    <input type="text" id="sKey" placeholder="الكود (مثلاً: Tah101)">
    <input type="text" id="sLink" placeholder="رابط المواد">
    <select id="sType">
        <option>الماجستير المصغر (سنة)</option>
        <option>إصلاح الدراجات الكهربائية</option>
        <option>كورس مخاطبة للمبتدئين</option>
    </select>
    <textarea id="sNote" placeholder="اكتب إشعاراً للطالب هنا..."></textarea>
    <button class="btn-add" onclick="save()">حفظ في السحابة</button>
    <div id="list"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://taha-academy-97d5e-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function save() {
        const data = {
            name: document.getElementById('sName').value,
            key: document.getElementById('sKey').value,
            link: document.getElementById('sLink').value,
            type: document.getElementById('sType').value,
            note: document.getElementById('sNote').value || "لا توجد إشعارات",
            date: new Date().toLocaleDateString('ar-EG')
        };
        if(data.name && data.key) {
            db.ref('users').push(data).then(() => { alert("تم الحفظ!"); location.reload(); });
        }
    }

    db.ref('users').on('value', s => {
        const list = document.getElementById('list');
        list.innerHTML = "<h3>المتدربون:</h3>";
        s.forEach(c => {
            const u = c.val();
            list.innerHTML += `<div class="user-card"><b>${u.name}</b> (الكود: ${u.key})<br><small>🔔 الإشعار: ${u.note}</small></div>`;
        });
    });
</script>
</body>
</html>
